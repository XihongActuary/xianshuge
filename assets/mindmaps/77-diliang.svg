  <rect x="30" y="337" width="170" height="96" rx="12" fill="#1d2640" stroke="#d9b26a" stroke-width="2"/>
  <text x="115" y="363" text-anchor="middle" font-size="22" font-weight="bold" fill="#e8d9b0">地粮</text>
  <text x="115" y="383" text-anchor="middle" font-size="13" font-style="italic" fill="#d9b26a" opacity="0.9">Fruits of the Earth</text>
  <text x="115" y="405" text-anchor="middle" font-size="11.5" fill="#d9b26a" opacity="0.85">纪德 · 去生活</text>
  <text x="115" y="421" text-anchor="middle" font-size="10" font-style="italic" fill="#d9b26a" opacity="0.7">Gide · Go and Live</text>
  <rect x="316" y="84" width="212" height="48" rx="9" fill="#d9b26a1f" stroke="#d9b26a" stroke-width="1.4"/>
  <text x="422" y="106" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#d9b26a">抛开这本书</text>
  <text x="422" y="124" text-anchor="middle" font-size="10.5" font-style="italic" fill="#d9b26a" opacity="0.8">Throw Away This Book</text>
  <circle cx="602" cy="56" r="4" fill="#d9b26a"/>
  <text x="618" y="55" font-size="15" fill="#cfc6b2">跑到外面去</text>
  <text x="618" y="72" font-size="11" font-style="italic" fill="#8fa3b8">Rush Outside</text>
  <circle cx="602" cy="108" r="4" fill="#d9b26a"/>
  <text x="618" y="107" font-size="15" fill="#cfc6b2">别带走我这书</text>
  <text x="618" y="124" font-size="11" font-style="italic" fill="#8fa3b8">Leave the Book</text>
  <circle cx="602" cy="160" r="4" fill="#d9b26a"/>
  <text x="618" y="159" font-size="15" fill="#cfc6b2">千百种姿态之一</text>
  <text x="618" y="176" font-size="11" font-style="italic" fill="#8fa3b8">One of a Thousand</text>
  <rect x="316" y="270" width="212" height="48" rx="9" fill="#7fa8c91f" stroke="#7fa8c9" stroke-width="1.4"/>
  <text x="422" y="292" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#7fa8c9">粮食</text>
  <text x="422" y="310" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7fa8c9" opacity="0.8">The Hunger</text>
  <circle cx="602" cy="242" r="4" fill="#7fa8c9"/>
  <text x="618" y="241" font-size="15" fill="#cfc6b2">我们地上的粮食</text>
  <text x="618" y="258" font-size="11" font-style="italic" fill="#8fa3b8">Earthly Food</text>
  <circle cx="602" cy="294" r="4" fill="#7fa8c9"/>
  <text x="618" y="293" font-size="15" fill="#cfc6b2">道德无以助我</text>
  <text x="618" y="310" font-size="11" font-style="italic" fill="#8fa3b8">Morality Fails</text>
  <circle cx="602" cy="346" r="4" fill="#7fa8c9"/>
  <text x="618" y="345" font-size="15" fill="#cfc6b2">每一欲望有回音</text>
  <text x="618" y="362" font-size="11" font-style="italic" fill="#8fa3b8">Every Desire Answered</text>
  <rect x="316" y="456" width="212" height="48" rx="9" fill="#a3c98a1f" stroke="#a3c98a" stroke-width="1.4"/>
  <text x="422" y="478" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a3c98a">守望者</text>
  <text x="422" y="496" text-anchor="middle" font-size="10.5" font-style="italic" fill="#a3c98a" opacity="0.8">The Watchman</text>
  <circle cx="602" cy="428" r="4" fill="#a3c98a"/>
  <text x="618" y="427" font-size="15" fill="#cfc6b2">生来为观看</text>
  <text x="618" y="444" font-size="11" font-style="italic" fill="#8fa3b8">Born to Behold</text>
  <circle cx="602" cy="480" r="4" fill="#a3c98a"/>
  <text x="618" y="479" font-size="15" fill="#cfc6b2">林扣斯的晨曦</text>
  <text x="618" y="496" font-size="11" font-style="italic" fill="#8fa3b8">Lynceus' Dawn</text>
  <circle cx="602" cy="532" r="4" fill="#a3c98a"/>
  <text x="618" y="531" font-size="15" fill="#cfc6b2">窗扉与焦额</text>
  <text x="618" y="548" font-size="11" font-style="italic" fill="#8fa3b8">The Window Pane</text>
  <rect x="316" y="642" width="212" height="48" rx="9" fill="#c98a8a1f" stroke="#c98a8a" stroke-width="1.4"/>
  <text x="422" y="664" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#c98a8a">磷光与寄语</text>
  <text x="422" y="682" text-anchor="middle" font-size="10.5" font-style="italic" fill="#c98a8a" opacity="0.8">Phosphorescence</text>
  <circle cx="602" cy="614" r="4" fill="#c98a8a"/>
  <text x="618" y="613" font-size="15" fill="#cfc6b2">动作附着于我们</text>
  <text x="618" y="630" font-size="11" font-style="italic" fill="#8fa3b8">Deeds Adhere</text>
  <circle cx="602" cy="666" r="4" fill="#c98a8a"/>
  <text x="618" y="665" font-size="15" fill="#cfc6b2">耗尽即光辉</text>
  <text x="618" y="682" font-size="11" font-style="italic" fill="#8fa3b8">Spent into Light</text>
  <circle cx="602" cy="718" r="4" fill="#c98a8a"/>
  <text x="618" y="717" font-size="15" fill="#cfc6b2">觅取你自己的</text>
  <text x="618" y="734" font-size="11" font-style="italic" fill="#8fa3b8">Take Your Own</text>
