  <circle cx="602" cy="108" r="4" fill="#d9b26a"/>
  <text x="618" y="107" font-size="15" fill="#cfc6b2">爪印偶然</text>
  <text x="618" y="124" font-size="11" font-style="italic" fill="#8fa3b8">Accidental marks</text>
