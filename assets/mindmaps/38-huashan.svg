  <rect x="30" y="523" width="170" height="96" rx="12" fill="#1d2640" stroke="#d9b26a" stroke-width="2"/>
  <text x="115" y="549" text-anchor="middle" font-size="22" font-weight="bold" fill="#e8d9b0">华杉讲透国学经典</text>
  <text x="115" y="569" text-anchor="middle" font-size="13" font-style="italic" fill="#d9b26a" opacity="0.9">Huashan's Classics</text>
  <text x="115" y="591" text-anchor="middle" font-size="11.5" fill="#d9b26a" opacity="0.85">孙子 · 论语 · 孟子，全是笨功夫</text>
  <text x="115" y="607" text-anchor="middle" font-size="10" font-style="italic" fill="#d9b26a" opacity="0.7">Sunzi, Analects, Mencius</text>
  <rect x="316" y="84" width="212" height="48" rx="9" fill="#d9b26a1f" stroke="#d9b26a" stroke-width="1.4"/>
  <text x="422" y="106" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#d9b26a">孙子 · 庙算</text>
  <text x="422" y="124" text-anchor="middle" font-size="10.5" font-style="italic" fill="#d9b26a" opacity="0.8">Sunzi · Calculation</text>
  <circle cx="602" cy="56" r="4" fill="#d9b26a"/>
  <text x="618" y="55" font-size="15" fill="#cfc6b2">五事七计</text>
  <text x="618" y="72" font-size="11" font-style="italic" fill="#8fa3b8">Five factors, seven counts</text>
  <circle cx="602" cy="108" r="4" fill="#d9b26a"/>
  <text x="618" y="107" font-size="15" fill="#cfc6b2">先胜而后战</text>
  <text x="618" y="124" font-size="11" font-style="italic" fill="#8fa3b8">Win first, fight later</text>
  <circle cx="602" cy="160" r="4" fill="#d9b26a"/>
  <text x="618" y="159" font-size="15" fill="#cfc6b2">不能等待是缺陷</text>
  <text x="618" y="176" font-size="11" font-style="italic" fill="#8fa3b8">Impatience is a flaw</text>
  <rect x="316" y="270" width="212" height="48" rx="9" fill="#7fa8c91f" stroke="#7fa8c9" stroke-width="1.4"/>
  <text x="422" y="292" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#7fa8c9">孙子 · 养法</text>
  <text x="422" y="310" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7fa8c9" opacity="0.8">Sunzi · Discipline</text>
  <circle cx="602" cy="242" r="4" fill="#7fa8c9"/>
  <text x="618" y="241" font-size="15" fill="#cfc6b2">奇念jī=预备队</text>
  <text x="618" y="258" font-size="11" font-style="italic" fill="#8fa3b8">Qi (ji) = reserve</text>
  <circle cx="602" cy="294" r="4" fill="#7fa8c9"/>
  <text x="618" y="293" font-size="15" fill="#cfc6b2">一战而定</text>
  <text x="618" y="310" font-size="11" font-style="italic" fill="#8fa3b8">One decisive battle</text>
  <circle cx="602" cy="346" r="4" fill="#7fa8c9"/>
  <text x="618" y="345" font-size="15" fill="#cfc6b2">忘了本谋</text>
  <text x="618" y="362" font-size="11" font-style="italic" fill="#8fa3b8">Never forget the aim</text>
  <rect x="316" y="456" width="212" height="48" rx="9" fill="#a3c98a1f" stroke="#a3c98a" stroke-width="1.4"/>
  <text x="422" y="478" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#a3c98a">论语 · 学习学</text>
  <text x="422" y="496" text-anchor="middle" font-size="10.5" font-style="italic" fill="#a3c98a" opacity="0.8">Analects · Learning</text>
  <circle cx="602" cy="428" r="4" fill="#a3c98a"/>
  <text x="618" y="427" font-size="15" fill="#cfc6b2">模仿是根本</text>
  <text x="618" y="444" font-size="11" font-style="italic" fill="#8fa3b8">Imitation first</text>
  <circle cx="602" cy="480" r="4" fill="#a3c98a"/>
  <text x="618" y="479" font-size="15" fill="#cfc6b2">日日不断之功</text>
  <text x="618" y="496" font-size="11" font-style="italic" fill="#8fa3b8">Daily unbroken effort</text>
  <circle cx="602" cy="532" r="4" fill="#a3c98a"/>
  <text x="618" y="531" font-size="15" fill="#cfc6b2">学为己</text>
  <text x="618" y="548" font-size="11" font-style="italic" fill="#8fa3b8">Learn for oneself</text>
  <rect x="316" y="642" width="212" height="48" rx="9" fill="#c98a8a1f" stroke="#c98a8a" stroke-width="1.4"/>
  <text x="422" y="664" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#c98a8a">论语 · 义利</text>
  <text x="422" y="682" text-anchor="middle" font-size="10.5" font-style="italic" fill="#c98a8a" opacity="0.8">Analects · Righteousness</text>
  <circle cx="602" cy="614" r="4" fill="#c98a8a"/>
  <text x="618" y="613" font-size="15" fill="#cfc6b2">君子喻于义</text>
  <text x="618" y="630" font-size="11" font-style="italic" fill="#8fa3b8">Junzi weighs what is right</text>
  <circle cx="602" cy="666" r="4" fill="#c98a8a"/>
  <text x="618" y="665" font-size="15" fill="#cfc6b2">己所不欲勿施于人</text>
  <text x="618" y="682" font-size="11" font-style="italic" fill="#8fa3b8">Do not impose</text>
  <circle cx="602" cy="718" r="4" fill="#c98a8a"/>
  <text x="618" y="717" font-size="15" fill="#cfc6b2">义利相合则取</text>
  <text x="618" y="734" font-size="11" font-style="italic" fill="#8fa3b8">Take profit with right</text>
  <rect x="316" y="828" width="212" height="48" rx="9" fill="#b39ac91f" stroke="#b39ac9" stroke-width="1.4"/>
  <text x="422" y="850" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#b39ac9">孟子 · 四端</text>
  <text x="422" y="868" text-anchor="middle" font-size="10.5" font-style="italic" fill="#b39ac9" opacity="0.8">Mencius · Four Seeds</text>
  <circle cx="602" cy="800" r="4" fill="#b39ac9"/>
  <text x="618" y="799" font-size="15" fill="#cfc6b2">恻隐之心仁之端</text>
  <text x="618" y="816" font-size="11" font-style="italic" fill="#8fa3b8">Compassion as seed</text>
  <circle cx="602" cy="852" r="4" fill="#b39ac9"/>
  <text x="618" y="851" font-size="15" fill="#cfc6b2">苟能充之保四海</text>
  <text x="618" y="868" font-size="11" font-style="italic" fill="#8fa3b8">Expand it or lose all</text>
  <circle cx="602" cy="904" r="4" fill="#b39ac9"/>
  <text x="618" y="903" font-size="15" fill="#cfc6b2">井边的逃犯</text>
  <text x="618" y="920" font-size="11" font-style="italic" fill="#8fa3b8">The convict at the well</text>
  <rect x="316" y="1014" width="212" height="48" rx="9" fill="#d9c98a1f" stroke="#d9c98a" stroke-width="1.4"/>
  <text x="422" y="1036" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#d9c98a">孟子 · 养气</text>
  <text x="422" y="1054" text-anchor="middle" font-size="10.5" font-style="italic" fill="#d9c98a" opacity="0.8">Mencius · Vital Force</text>
  <circle cx="602" cy="986" r="4" fill="#d9c98a"/>
  <text x="618" y="985" font-size="15" fill="#cfc6b2">浩然之气</text>
  <text x="618" y="1002" font-size="11" font-style="italic" fill="#8fa3b8">Flood-like qi</text>
  <circle cx="602" cy="1038" r="4" fill="#d9c98a"/>
  <text x="618" y="1037" font-size="15" fill="#cfc6b2">正气不充故惧</text>
  <text x="618" y="1054" font-size="11" font-style="italic" fill="#8fa3b8">Fear as deficit</text>
  <circle cx="602" cy="1090" r="4" fill="#d9c98a"/>
  <text x="618" y="1089" font-size="15" fill="#cfc6b2">仁者的怕</text>
  <text x="618" y="1106" font-size="11" font-style="italic" fill="#8fa3b8">The kind heart fears</text>
